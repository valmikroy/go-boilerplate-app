apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-boilerplate-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-boilerplate-app
  template:
    metadata:
      labels:
        app: go-boilerplate-app
    spec:
      containers:
        - name: go-boilerplate-app
          image: go-boilerplate-app:latest
          imagePullPolicy: Never  
          ports:
          - containerPort: 8080
